---
name: Gradle

on:
  push:
  pull_request:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  build:
    strategy:
      matrix:
        java: [11]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'zulu'
          cache: "gradle"
      - name: Run commands
        run: |
          ./gradlew build
  publish_snapshots:
    if: ${{ github.ref == 'refs/heads/master' && github.repository_owner == 'ome' }}
    needs: build
    uses: ome/action-workflows/.github/workflows/gradle_publish.yml@main
    with:
      ARTIFACTORY_URL: "snapshots"
    secrets:
      ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags') && github.repository_owner == 'ome'
    uses: ome/action-workflows/.github/workflows/gradle_publish.yml@main
    with:
      ARTIFACTORY_URL: "releases"
    secrets:
      ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
